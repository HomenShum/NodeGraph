<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nodegraph-mcp viewer — agents author, the rail shows</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #0b0e12; color: #dfe5ea; }
      main { width: min(1240px, calc(100% - 32px)); margin: 24px auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 10px; color: #8b949d; font-size: 13px; line-height: 1.5; max-width: 980px; }
      #stage { border: 1px solid #1d242c; border-radius: 12px; overflow: hidden; background: #0e1319; }
      /* Was #55606a: 3.01:1 on this ground, the same defect the gallery's
         counter carried (D6), on the line that reports how many events
         survived the boundary. #8b949d is 6.29:1. */
      #log { color: #8b949d; font-size: 12px; margin-top: 8px; white-space: pre-wrap;
             font-variant-numeric: tabular-nums; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
          "graphology": "https://esm.sh/graphology@0.26.0",
          "graphology-layout-forceatlas2": "https://esm.sh/graphology-layout-forceatlas2@0.10.1",
          "graphology-layout-forceatlas2/worker.js": "https://esm.sh/graphology-layout-forceatlas2@0.10.1/worker.js",
          "sigma": "https://esm.sh/sigma@3.0.3",
          "@sigma/node-border": "https://esm.sh/@sigma/node-border@3.0.0?deps=sigma@3.0.3"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>nodegraph-mcp — the rail any MCP agent can author</h1>
      <p>
        This page tails <code>.nodegraph/events.jsonl</code>, the log the MCP server appends for
        every ACCEPTED tool call. Unreceipted assertions were refused at the protocol boundary and
        never reach this file — what you see is exactly what survived the trust grammar.
      </p>
      <div id="stage"><div id="root"></div></div>
      <p id="log"></p>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
