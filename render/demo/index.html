<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NodeGraph Live — scenario gallery</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #0b0e12; color: #dfe5ea; }
      main { width: min(1240px, calc(100% - 32px)); margin: 24px auto; }
      h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 2px; }
      p.sub { margin: 0 0 12px; color: #8b949d; line-height: 1.45; font-size: 13px; }
      #scenarios { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      #scenarios button {
        border: 1px solid #2a323b; border-radius: 999px; background: #131922;
        color: #c8d2da; padding: 6px 12px; cursor: pointer; font-size: 12.5px;
      }
      #scenarios button:hover { border-color: #4b5865; }
      #scenarios button.active { background: #1d2a3a; border-color: #3d7bd9; color: #e8f1fa; }
      #stage { border: 1px solid #1d242c; border-radius: 12px; overflow: hidden; background: #0e1319; }
      #root { display: block; width: 100%; min-height: 620px; }
      #caption { margin: 10px 2px 0; color: #7f8992; font-size: 12.5px; line-height: 1.5; max-width: 980px; }
      #stats { color: #55606a; font-size: 12px; margin-top: 4px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
          "graphology": "https://esm.sh/graphology@0.26.0",
          "graphology-layout-forceatlas2": "https://esm.sh/graphology-layout-forceatlas2@0.10.1",
          "graphology-layout-forceatlas2/worker.js": "https://esm.sh/graphology-layout-forceatlas2@0.10.1/worker.js",
          "sigma": "https://esm.sh/sigma@3.0.3",
          "@sigma/node-border": "https://esm.sh/@sigma/node-border@3.0.0?deps=sigma@3.0.3"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>NodeGraph Live — scenario gallery</h1>
      <p class="sub">
        Ten scenarios, one trust grammar: evidence edges carry measured weight, assertions carry a
        release badge, traversal is faint history. Motion runs only while an ingestion is live,
        then the field goes still. Drag anything — positions are layout, never meaning.
      </p>
      <div id="scenarios"></div>
      <div id="stage"><div id="root"></div></div>
      <p id="caption"></p>
      <p id="stats"></p>
    </main>
    <script type="module" src="/demo/demo.js"></script>
  </body>
</html>
