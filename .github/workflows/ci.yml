name: NodeGraph CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nodegraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            render/package-lock.json
      - run: npm ci
      - run: npm --prefix render ci
      - run: npm run typecheck
      - run: npm --prefix render run typecheck
      - run: npm run test:all
      - run: npm run example:build
      - run: npm run verify:packages
      - run: npm audit
      - run: npm --prefix render audit
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: packages-${{ matrix.os }}-${{ matrix.node }}
          path: .proofloop/
          include-hidden-files: true
          if-no-files-found: error

  browser:
    name: Gallery, composition and packed browser consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            render/package-lock.json
      - run: npm ci
      - run: npm --prefix render ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps chromium
        working-directory: render
      - run: npm run verify:packages -- --browser
      - run: npm --prefix render run verify:demo -- --compose
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nodegraph-browser-proof
          path: |
            .proofloop/
            render/.proofloop/
          include-hidden-files: true
          if-no-files-found: error
